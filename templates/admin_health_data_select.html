<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>健康数据管理</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .action-bar { display: flex; justify-content: space-between; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 4px; border: 1px solid #e9ecef;}
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .btn-edit { background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; text-decoration: none;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin: 0; color: #2c3e50;">健康数据管理</h2>
        <!-- 智能判断返回主页的路径 -->
        <a href="{{ '/super_admin_dashboard' if session.get('role') == 'super' else '/sub_admin_dashboard' }}" style="text-decoration: none; color: #6c757d; font-weight: bold;">返回主页</a>
    </div>

    <div class="action-bar">
        <div style="font-size: 13px; color: #666; line-height: 1.6;">
            请搜索并选择用户档案以进入管理。
        </div>
        <form method="GET" action="/admin/health_data_select" style="display: flex; gap: 5px;">
            <input type="text" name="search" value="{{ search }}" placeholder="输入患者姓名或主账号手机号..." style="padding: 5px; border: 1px solid #ccc; border-radius: 3px; width: 220px;">
            <button type="submit" style="padding: 5px 15px; background: #28a745; color: white; border: none; border-radius: 3px; cursor:pointer;">搜索</button>
        </form>
    </div>

    <table>
        <tr>
            <th>手机号</th>
            <th>姓名</th>
            <th>家庭关系</th>
            <th>年龄 / 性别</th>
            <th>既往病史</th>
            <th>操作</th>
        </tr>
        {% for m in members %}
        <tr>
            <td style="color: #666;">{{ m.user.phone }}</td>
            <td style="font-weight: bold;">{{ m.name }}</td>
            <td>{{ m.relation }}</td>
            <td>{{ m.age or '-' }} 岁 / {{ m.gender }}</td>
            <td style="color: #dc3545; font-size: 13px;">{{ m.disease_info[:20] ~ '...' if m.disease_info else '无记录' }}</td>
            <td>
                <a href="/admin/health_data/{{ m.id }}" class="btn-edit">选择</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% if not members %}
        <div style="text-align: center; color: #999; padding: 30px;">未找到匹配的数据。</div>
    {% endif %}
</div>

</body>
</html>
