<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>验证账号 - 更改密码</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h3 { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
        button, .btn-back { width: 48%; padding: 10px; text-align: center; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; }
        button { background-color: #d9534f; color: white; }
        .btn-back { background-color: #6c757d; color: white; display: inline-block; box-sizing: border-box; }
        .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="form-container">
    <h3>修改密码</h3>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="form-group"><label>请输入旧密码</label><input type="password" name="old_password" required></div>
        <div class="form-group"><label>请输入新密码</label><input type="password" name="new_password" required></div>
        <div class="form-group"><label>请确认新密码</label><input type="password" name="confirm_password" required></div>

        <div class="btn-group">
            <button type="submit">确认提交</button>
            <a href="/profile" class="btn-back">返回</a>
        </div>
    </form>
</div>
</body>
</html>
