<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>公共健康管理系统 - 登录</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; line-height: 1.8; }
        .link a { color: #007bff; text-decoration: none; }
        .flash-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-size: 14px; font-weight: bold; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

<div class="login-container">
    <h2>系统登录</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-msg">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>身份类型</label>
            <select name="role_type" required>
                <option value="user">普通用户</option>
                <option value="admin">系统管理员</option>
            </select>
        </div>
        <div class="form-group">
            <label>登录账号 (手机号或管理员账号)</label>
            <input type="text" name="account" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">登录</button>
    </form>

    <div class="link">
        没有账号？ <a href="/register">立即注册</a><br>
        <span style="color: #666; font-size: 13px;">忘记密码？请联系上级管理员重置。</span>
    </div>
</div>

</body>
</html>
